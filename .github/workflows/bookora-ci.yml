name: Bookora CI

on:
  push:
    paths: [ 'bookora/**', '.github/workflows/bookora-ci.yml' ]
  pull_request:
    paths: [ 'bookora/**' ]

defaults:
  run:
    working-directory: bookora/bookora

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: composer install --no-progress
      - run: composer lint
      - run: composer test

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint:js
      - run: npm run build
